<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Stock NAMIA</title>
    <style>
        /* Import font tulisan tangan */
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Permanent+Marker&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Permanent Marker', cursive, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ================= BACKGROUND KEREN & KECE ================= */
        /* Lapisan 1: Gradasi Warna Neon Gelap */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 15% 50%, rgba(0, 150, 255, 0.15), transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(255, 0, 150, 0.15), transparent 40%),
                radial-gradient(circle at 50% 100%, rgba(0, 255, 200, 0.1), transparent 50%);
            z-index: -2;
        }

        /* Lapisan 2: Pola Grid Futuristik */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            pointer-events: none;
        }

        /* Kontainer utama */
        .app-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            z-index: 1;
        }

        /* ================= FOTO 1: TAMPILAN UTAMA ================= */
        #view-main {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
        }

        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
        }

        /* Efek Glow pada Foto Profil */
        .profile-pic {
            width: 130px;
            height: 130px;
            border: 3px solid #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            margin-bottom: 15px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.2);
            transition: 0.3s;
            background: rgba(0,0,0,0.5);
        }

        .profile-pic:hover {
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.7);
            transform: scale(1.02);
        }

        .profile-pic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .profile-pic input[type="file"] {
            display: none;
        }

        .profile-name {
            font-family: 'Caveat', cursive;
            font-size: 45px;
            letter-spacing: 3px;
            text-align: center;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6), 0 0 30px rgba(0, 150, 255, 0.4);
        }

        .menu-buttons {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Tombol Menu dengan Efek Glow */
        .btn-menu {
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 3px solid #fff;
            border-radius: 8px;
            padding: 22px;
            font-size: 24px;
            font-family: 'Permanent Marker', cursive;
            cursor: pointer;
            text-align: center;
            transform: rotate(-1deg);
            transition: 0.3s;
            position: relative;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            letter-spacing: 2px;
        }

        .btn-menu:nth-child(2) {
            transform: rotate(1deg);
        }

        .btn-menu:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
            transform: scale(1.03) rotate(0deg);
        }

        .btn-menu:active {
            transform: scale(0.98);
        }

        /* ================= FOTO 2: TAMPILAN GRID STOCK ================= */
        #view-stock {
            display: none;
            width: 100%;
        }

        .header-stock {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .btn-dots {
            background: transparent;
            color: #fff;
            border: none;
            font-size: 30px;
            cursor: pointer;
            font-family: 'Permanent Marker', cursive;
            letter-spacing: 2px;
            transition: 0.3s;
        }
        
        .btn-dots:hover {
            text-shadow: 0 0 15px #fff;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            right: 20px;
            top: 60px;
            background: rgba(20, 20, 20, 0.95);
            border: 2px solid #fff;
            border-radius: 8px;
            padding: 10px;
            z-index: 10;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
        }
        
        .dropdown-menu button {
            display: block;
            background: transparent;
            color: #fff;
            border: none;
            font-family: 'Permanent Marker', cursive;
            font-size: 14px;
            padding: 12px 15px;
            cursor: pointer;
            width: 100%;
            text-align: left;
            border-radius: 5px;
            transition: 0.2s;
        }
        
        .dropdown-menu button:hover {
            background: #fff;
            color: #000;
        }

        .stock-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .stock-item {
            border: 3px solid #fff;
            border-radius: 8px;
            height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 10px;
            cursor: pointer;
            position: relative;
            background-size: cover;
            background-position: center;
            transform: rotate(-1deg);
            transition: 0.3s;
            background-color: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }
        
        .stock-item:nth-child(even) {
            transform: rotate(1deg);
        }

        .stock-item:hover {
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
            transform: scale(1.03) rotate(0deg);
            border-color: #00ffff;
        }

        .stock-item::before {
            content: "X";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            color: rgba(255,255,255,0.1);
            z-index: 1;
        }

        .stock-item.has-image::before {
            display: none;
        }

        .stock-label {
            background: rgba(0,0,0,0.8);
            padding: 8px;
            text-align: center;
            font-size: 18px;
            z-index: 2;
            border-top: 2px solid #fff;
            letter-spacing: 1px;
            border-radius: 0 0 4px 4px;
        }

        /* ================= FOTO 3: TAMPILAN DETAIL ================= */
        #view-detail {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
            width: 100%;
        }

        .detail-image-box {
            width: 100%;
            height: 400px;
            border: 3px solid #fff;
            border-radius: 10px;
            margin-bottom: 30px;
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 120px;
            color: rgba(255,255,255,0.1);
            background-color: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2), inset 0 0 20px rgba(0,0,0,0.8);
            transition: 0.3s;
        }

        .detail-image-box:hover {
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.4);
        }

        .detail-image-box.has-image {
            color: transparent;
        }

        /* Tombol Order dengan Efek Neon */
        .btn-order {
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            border: 3px solid #fff;
            border-radius: 8px;
            padding: 18px 50px;
            font-size: 26px;
            font-family: 'Permanent Marker', cursive;
            cursor: pointer;
            text-transform: lowercase;
            transform: rotate(-2deg);
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            letter-spacing: 2px;
        }

        .btn-order:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.9), 0 0 80px rgba(0, 255, 200, 0.5);
            transform: scale(1.05) rotate(0deg);
        }

        .btn-order:active {
            transform: scale(0.95);
        }

        /* Tombol Kembali */
        .btn-back {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: transparent;
            border: none;
            font-size: 30px;
            cursor: pointer;
            font-family: 'Permanent Marker', cursive;
            z-index: 100;
            transition: 0.3s;
        }

        .btn-back:hover {
            text-shadow: 0 0 20px #fff;
            transform: translateX(-5px);
        }

    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- TAMPILAN 1: MENU UTAMA -->
        <div id="view-main">
            <div class="profile-section">
                <label class="profile-pic" for="profile-upload">
                    <span id="profile-placeholder">😊</span>
                    <img id="profile-img" src="" alt="Profile">
                    <input type="file" id="profile-upload" accept="image/*">
                </label>
                <h1 class="profile-name" id="profile-name-display">STOCK CALLZY</h1>
            </div>

            <div class="menu-buttons">
                <button class="btn-menu" onclick="openStock('FF')">STOCK FF</button>
                <button class="btn-menu" onclick="openStock('ML')">STOCK ML</button>
            </div>
        </div>

        <!-- TAMPILAN 2: GRID STOCK -->
        <div id="view-stock">
            <button class="btn-back" onclick="goBack('main')">←</button>
            
            <div class="header-stock">
                <button class="btn-dots" onclick="toggleDropdown()">⋮</button>
                <div class="dropdown-menu" id="dropdown">
                    <button onclick="addStockPhoto()">+ Tambah Foto Stock</button>
                    <button onclick="deleteStockPhoto()">- Hapus Foto Stock</button>
                </div>
            </div>

            <div class="stock-grid" id="stock-grid">
                <!-- Item Stock di-generate JS -->
            </div>
        </div>

        <!-- TAMPILAN 3: DETAIL STOCK -->
        <div id="view-detail">
            <button class="btn-back" onclick="goBack('stock')">←</button>
            
            <div class="detail-image-box" id="detail-image">
                X
            </div>
            
            <button class="btn-order" id="btn-order-action">order</button>
        </div>

    </div>

    <script>
        const WA_NUMBER = "6285895196739";
        let currentStockType = 'FF';
        let currentStockIndex = 1;

        const stockData = {
            'FF': {},
            'ML': {}
        };

        const viewMain = document.getElementById('view-main');
        const viewStock = document.getElementById('view-stock');
        const viewDetail = document.getElementById('view-detail');
        const stockGrid = document.getElementById('stock-grid');
        const dropdown = document.getElementById('dropdown');
        const profileUpload = document.getElementById('profile-upload');
        const profileImg = document.getElementById('profile-img');
        const profilePlaceholder = document.getElementById('profile-placeholder');

        // Upload Foto Profil
        profileUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    profileImg.src = event.target.result;
                    profileImg.style.display = 'block';
                    profilePlaceholder.style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        });

        // Navigasi
        function openStock(type) {
            currentStockType = type;
            viewMain.style.display = 'none';
            viewDetail.style.display = 'none';
            viewStock.style.display = 'block';
            renderStockGrid();
        }

        function goBack(target) {
            dropdown.style.display = 'none';
            if (target === 'main') {
                viewStock.style.display = 'none';
                viewMain.style.display = 'flex';
            } else if (target === 'stock') {
                viewDetail.style.display = 'none';
                viewStock.style.display = 'block';
            }
        }

        // Render Grid
        function renderStockGrid() {
            stockGrid.innerHTML = '';
            for (let i = 1; i <= 6; i++) {
                const item = document.createElement('div');
                item.className = 'stock-item';
                item.onclick = () => openDetail(i);
                
                const imgUrl = stockData[currentStockType][i];
                if (imgUrl) {
                    item.style.backgroundImage = `url(${imgUrl})`;
                    item.classList.add('has-image');
                }

                const label = document.createElement('div');
                label.className = 'stock-label';
                label.innerText = `stok ${i}`;
                
                item.appendChild(label);
                stockGrid.appendChild(item);
            }
        }

        // Fitur Titik 3
        function toggleDropdown() {
            dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
        }

        function addStockPhoto() {
            dropdown.style.display = 'none';
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        let saved = false;
                        for(let i=1; i<=6; i++) {
                            if(!stockData[currentStockType][i]) {
                                stockData[currentStockType][i] = event.target.result;
                                saved = true;
                                break;
                            }
                        }
                        if(!saved) {
                            alert("Slot stock penuh! Hapus salah satu terlebih dahulu.");
                        }
                        renderStockGrid();
                    }
                    reader.readAsDataURL(file);
                }
            };
            input.click();
        }

        function deleteStockPhoto() {
            dropdown.style.display = 'none';
            const slot = prompt("Masukkan nomor stok yang ingin dihapus (1-6):");
            if (slot && slot >= 1 && slot <= 6) {
                if (stockData[currentStockType][slot]) {
                    delete stockData[currentStockType][slot];
                    renderStockGrid();
                    alert(`Foto stok ${slot} berhasil dihapus.`);
                } else {
                    alert(`Stok ${slot} belum ada fotonya.`);
                }
            }
        }

        // Detail & Order
        function openDetail(index) {
            currentStockIndex = index;
            viewStock.style.display = 'none';
            viewDetail.style.display = 'flex';

            const detailImageBox = document.getElementById('detail-image');
            const imgUrl = stockData[currentStockType][index];

            if (imgUrl) {
                detailImageBox.style.backgroundImage = `url(${imgUrl})`;
                detailImageBox.classList.add('has-image');
                detailImageBox.innerText = '';
            } else {
                detailImageBox.style.backgroundImage = 'none';
                detailImageBox.classList.remove('has-image');
                detailImageBox.innerText = 'X';
            }

            const btnOrder = document.getElementById('btn-order-action');
            btnOrder.onclick = function() {
                const pesan = `bg saya mau beli stock ${index}`;
                const url = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(pesan)}`;
                window.open(url, '_blank');
            };
        }
    </script>
</body>
</html>
